server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 16KB

spring:
  application:
    name: ai-capability-gateway
  # No default profile: activation must be explicit (SPRING_PROFILES_ACTIVE).
  # We must NOT default to `local` — application-local.yml holds real
  # credentials and is git-ignored; it must be an opt-in overlay only.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
  flyway:
    enabled: true
    locations: classpath:db/migration
    # The repository is pre-launch and owns a single empty-database baseline.
    # Never silently baseline an existing schema and skip V1.
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ai-capability-gateway
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

# Gateway configuration
gateway:
  # Non-sensitive static configuration
  max-request-size-bytes: 65536  # 64 KiB
  max-response-bytes: 1048576    # 1 MiB
  max-json-depth: 16
  max-array-length: 1000
  max-object-fields: 1000
  max-string-bytes: 16384
  max-node-count: 10000
  default-timeout-ms: 15000
  
  # Environment configuration (resolved from env)
  # Must be explicit in every deployment. Local development gets its default
  # only from the opt-in application-local.yml overlay.
  environment: ${GATEWAY_ENV:}

  # Authentication/Authorization provider selection (pluggable).
  #   stub     -> default initial-release stubs (no real verification)
  #   sa-token -> Sa-Token JWT adapter (gateway-adapter-auth-satoken)
  #
  # When switching to sa-token, both the gateway and the example Demo must
  # share the same jwt-secret-key. Set the env var GATEWAY_AUTH_JWT_SECRET
  # on both sides to an identical value.
  auth:
    visibility-cache-max-entries: ${GATEWAY_AUTH_VISIBILITY_CACHE_MAX_ENTRIES:10000}
    visibility-cache-max-bytes: ${GATEWAY_AUTH_VISIBILITY_CACHE_MAX_BYTES:67108864}
    provider: ${GATEWAY_AUTH_PROVIDER:}
    sa-token:
      token-name: Authorization
      login-type: ${GATEWAY_AUTH_LOGIN_TYPE:login}
      jwt-secret-key: ${GATEWAY_AUTH_JWT_SECRET:}
      access-token-timeout-seconds: 7200    # 2h
      refresh-token-timeout-seconds: 604800 # 7d

    # Console admin credentials (used when gateway.auth.provider=sa-token)
    console-admin:
      username: ${GATEWAY_CONSOLE_ADMIN_USERNAME:}
      password: ${GATEWAY_CONSOLE_ADMIN_PASSWORD:}

  # Distributed snapshot cache provider (pluggable, milestone M2).
  #   stub  -> logging SnapshotNotifier + direct PostgreSQL CatalogPort
  #   redis -> Redis pub/sub notifier + after-commit CatalogPort cache decorator
  cache:
    provider: ${GATEWAY_CACHE_PROVIDER:}

  # Redis (Redisson) connection — used when gateway.cache.provider=redis
  # (and later by milestone M4 distributed locks).
  redis:
    address: ${GATEWAY_REDIS_ADDRESS:}
    password: ${GATEWAY_REDIS_PASSWORD:}
    database: ${GATEWAY_REDIS_DATABASE:0}
    snapshot:
      local-ttl-seconds: 30   # Caffeine L1 TTL

  # Rate limiting provider (pluggable, milestone M3).
  #   stub     -> always-allow (no limiting)
  #   sentinel -> Sentinel Core programmatic flow/degrade rules
  ratelimit:
    provider: ${GATEWAY_RATELIMIT_PROVIDER:}

  # Sentinel hardcoded rule thresholds (used when ratelimit.provider=sentinel)
  sentinel:
    global-qps: 2000
    llm-qps: 20
    llm-max-queueing-ms: 2000
  
  # LLM configuration
  llm:
    endpoint: ${LLM_ENDPOINT:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    temperature: 0.1
    max-tokens: 4096
    max-concurrent: 10
  
  # Registry configuration
  registries:
    nacos-main:
      address: ${NACOS_ADDRESS:}
      port: ${NACOS_PORT:8848}
  
  # Audit batch writer
  audit:
    batch-size: 50
    batch-wait-millis: 5
    queue-capacity: 10000

  operation:
    confirmation-secret: ${GATEWAY_CONFIRMATION_SECRET:}

  agent:
    tool-ref-current-key-id: ${GATEWAY_AGENT_TOOL_REF_KEY_ID:k1}
    tool-ref-secret: ${GATEWAY_AGENT_TOOL_REF_SECRET:}
    tool-ref-previous-key-id: ${GATEWAY_AGENT_TOOL_REF_PREVIOUS_KEY_ID:}
    tool-ref-previous-secret: ${GATEWAY_AGENT_TOOL_REF_PREVIOUS_SECRET:}
    tool-ref-ttl-seconds: ${GATEWAY_AGENT_TOOL_REF_TTL_SECONDS:120}
    resolve-timeout-ms: ${GATEWAY_AGENT_RESOLVE_TIMEOUT_MS:100}
    pending-confirmation-max-entries: ${GATEWAY_AGENT_PENDING_CONFIRMATION_MAX_ENTRIES:10000}
    turn-max-entries: ${GATEWAY_AGENT_TURN_MAX_ENTRIES:10000}
    resolve-max-concurrent: ${GATEWAY_AGENT_RESOLVE_MAX_CONCURRENT:64}
    resolve-max-queue: ${GATEWAY_AGENT_RESOLVE_MAX_QUEUE:64}
    catalog-max-capabilities: ${GATEWAY_AGENT_CATALOG_MAX_CAPABILITIES:10000}
    catalog-max-index-bytes: ${GATEWAY_AGENT_CATALOG_MAX_INDEX_BYTES:67108864}
    catalog-max-process-memory-bytes: ${GATEWAY_AGENT_CATALOG_MAX_PROCESS_MEMORY_BYTES:536870912}
    catalog-build-timeout-ms: ${GATEWAY_AGENT_CATALOG_BUILD_TIMEOUT_MS:5000}
    catalog-lease-hold-timeout-ms: ${GATEWAY_AGENT_CATALOG_LEASE_HOLD_TIMEOUT_MS:1000}
    catalog-io-max-rows: ${GATEWAY_AGENT_CATALOG_IO_MAX_ROWS:10000}
    catalog-io-query-timeout-ms: ${GATEWAY_AGENT_CATALOG_IO_QUERY_TIMEOUT_MS:3000}
    catalog-io-max-payload-bytes: ${GATEWAY_AGENT_CATALOG_IO_MAX_PAYLOAD_BYTES:134217728}
    mcp-max-sessions: ${GATEWAY_AGENT_MCP_MAX_SESSIONS:1000}
    mcp-session-idle-seconds: ${GATEWAY_AGENT_MCP_SESSION_IDLE_SECONDS:1800}
    mcp-security-mode: ${GATEWAY_AGENT_MCP_SECURITY_MODE:READ_ONLY}
    mcp-call-timeout-ms: ${GATEWAY_AGENT_MCP_CALL_TIMEOUT_MS:30000}
    mcp-close-timeout-ms: ${GATEWAY_AGENT_MCP_CLOSE_TIMEOUT_MS:5000}
    mcp-node-id: ${GATEWAY_AGENT_MCP_NODE_ID:local}
    mcp-sse-qps: ${GATEWAY_AGENT_MCP_SSE_QPS:100}
    mcp-message-qps: ${GATEWAY_AGENT_MCP_MESSAGE_QPS:500}
    mcp-resolve-qps: ${GATEWAY_AGENT_MCP_RESOLVE_QPS:200}
    mcp-call-qps: ${GATEWAY_AGENT_MCP_CALL_QPS:200}
    # 只填写已认证 Bearer Token 的 SHA-256 指纹，不填写明文 Token。
    # 未命中该注册表的客户端始终只能按 READ_ONLY 执行。
    mcp-trusted-clients: []
  
  # Rate limits
  rate-limits:
    per-user: 100
    per-tenant: 500
    per-application: 1000
    llm-concurrent: 10
    provider-concurrent: 50
    clarification-sessions: 100
    prepare-operations: 50
  
  # Snapshot configuration
  snapshot:
    max-lag-millis: 30000
    
  # Data retention
  retention:
    interaction-ttl-hours: 1
    audit-retention-days: 90

# Dubbo configuration
dubbo:
  application:
    name: ai-capability-gateway
    register-mode: interface
    serialize-check-status: STRICT
  registry:
    address: ${DUBBO_REGISTRY:}
  protocol:
    name: dubbo
    port: -1
  consumer:
    timeout: 3000
    retries: 1
    check: false
    serialization: fastjson2

logging:
  level:
    com.ai.gateway: INFO
    org.springframework: WARN
    org.apache.dubbo: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
