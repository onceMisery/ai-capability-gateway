name: verify

on:
  push:
  pull_request:

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: console-ui/package-lock.json
      - name: Run complete delivery gate
        run: bash ci/pipeline.sh
